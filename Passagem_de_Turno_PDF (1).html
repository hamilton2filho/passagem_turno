<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passagem de Turno · Filtros e CAC</title>
<style>
:root{
  --navy:#233176; --navy-d:#141C4A; --blue:#0069B5; --blue-d:#0B4F8A; --orange:#FAA61A; --yellow:#FEBA12;
  --ink:#151A22; --muted:#68707C; --bg:#F5F6F7; --card:#FFFFFF; --line:#E1E4E8; --infill:#FFF5D9; --inline:#F3D27A;
  --ok:#2E7D32; --ok-bg:#E8F4E9; --bad:#B00020; --bad-bg:#FDECEE; --bad-line:#F4B4BC; --warn:#8A5A00; --warn-bg:#FFF3D6;
  --zap:#1FA855; --prox:#B4472B; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:#D9DCE3;color:var(--ink);font:400 16px/1.35 Arial,'Segoe UI',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* barra do protótipo */
.proto{position:sticky;top:0;z-index:20;background:#1B1F2E;color:#C9CEDB;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px}
.proto b{color:#fff}
.proto .seg{display:inline-flex;border:1px solid #444B60;border-radius:6px;overflow:hidden}
.proto .seg button{background:none;border:0;color:#C9CEDB;padding:5px 11px;font-size:13px}
.proto .seg button.on{background:var(--orange);color:#151A22;font-weight:700}
.proto .dir{margin-left:auto;color:#8A90A3}
.palco{padding:16px 0 40px;transition:padding .2s}
.app{background:var(--bg);margin:0 auto;padding:12px 12px 28px;min-height:calc(100vh - 80px);max-width:760px;display:flex;flex-direction:column;gap:12px}
.app.wide{max-width:1100px}
body.v-cel .app{max-width:390px;border-radius:26px;box-shadow:0 0 0 10px #10142A,0 30px 60px -20px rgba(0,0,0,.5);min-height:780px}
body.v-cel .palco{padding:30px 16px 50px}
body.v-cel .app .duas{grid-template-columns:1fr}
@media (max-width:600px){html,body{background:var(--bg)}.palco{padding:0}.proto{position:static}.proto .dir{display:none}}
/* cabeçalho */
.cab{background:linear-gradient(90deg,var(--navy-d) 0%,var(--navy) 45%,var(--blue) 100%);color:#fff;border-radius:3px;padding:16px 18px 20px}
.cab img{height:34px;display:block}
.cab h1{font:700 25px/1.08 Arial,sans-serif;margin:12px 0 0;text-transform:uppercase}
.cab .bar{width:52px;height:5px;background:var(--orange);margin:10px 0}
.cab p{font-size:14px;color:#DCE3F2;margin:0}
h2{font-size:21px;margin:6px 4px 0;color:var(--ink)}
h3{font-size:17px;margin:6px 4px 0}
.rot{font-weight:700;font-size:16px;margin:4px 4px -4px}
.mini{font-size:12px;color:var(--muted);margin:0 2px}
/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:8px 14px;border-radius:6px;border:2px solid var(--blue);background:#fff;color:var(--blue-d);font-weight:700;font-size:17px;text-align:center}
.btn:hover{background:#EEF4FB}
.btn.pri{background:var(--orange);border-color:var(--orange);color:var(--ink);min-height:52px}
.btn.pri:hover{background:#E8940A}
.btn.zap{background:var(--zap);border-color:var(--zap);color:#fff}
.btn.zap:hover{background:#178A45}
.btn.ok{border-color:var(--ok);color:var(--ok);background:#fff}
.btn.ok:hover{background:var(--ok-bg)}
.btn.perigo{border-color:var(--bad);color:var(--bad)}
.btn.peq{min-height:38px;font-size:15px;width:auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linha{display:flex;gap:10px;flex-wrap:wrap}.linha>*{flex:1 1 160px}
/* campos */
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--infill);border:1px solid var(--inline);border-radius:3px;padding:10px 12px;font-size:17px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,105,181,.18)}
textarea{min-height:84px;resize:vertical}
.cx{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.agora .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.agora .v{font-size:28px;font-weight:700;margin:2px 0}
.chips4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{height:50px;border:2px solid var(--line);background:#fff;border-radius:8px;font-weight:700;font-size:22px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{color:#fff;font-size:12px;font-weight:700;padding:5px 8px;border-radius:3px}
/* checklist */
.banner{color:#fff;border-radius:3px;padding:12px 14px}
.banner .e{font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.9;text-transform:uppercase}
.banner .n{font-size:24px;font-weight:700;text-transform:uppercase;margin:3px 0}
.banner .s{font-size:12px;opacity:.85}
.prog{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--orange)}
.perg{display:flex;flex-direction:column;gap:8px}
.perg .t{font-weight:700;font-size:16px;margin:0 4px}
.perg.falta .t{color:var(--bad)}
.par{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:46px;border:2px solid var(--line);background:#fff;border-radius:6px;font-weight:700;font-size:16px;padding:6px}
.opt.sm{font-size:14px}
.opt.okon{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.badon{background:var(--bad);border-color:var(--bad);color:#fff}
.obs{background:var(--bad-bg)!important;border-color:var(--bad-line)!important}
.perg.trava{opacity:.42}.perg.trava button,.perg.trava textarea,.perg.trava input{cursor:not-allowed}
.req{color:var(--bad);font-weight:700;font-size:13px;margin:0 4px}
.dica{font-size:13px;color:var(--muted);margin:0 4px}
.cond .t{color:var(--bad)}
/* quadro */
.duas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.at{min-height:48px;border:2px solid var(--line);background:#fff;border-radius:6px;font-weight:700;font-size:14px;padding:6px 8px;line-height:1.2}
.at.prox{background:var(--prox);border-color:var(--prox);color:#fff}
.at.feito{background:var(--ok);border-color:var(--ok);color:#fff}
.tit-prox{color:var(--prox)}.tit-feito{color:var(--ok)}
.step{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line)}
.step span{flex:1}
.step button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;line-height:1}
.step button.mais{background:var(--navy);border-color:var(--navy);color:#fff}
.step b{width:34px;text-align:center;font-size:20px}
.pesos{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.pesos label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:3px}
/* relatório */
.salvo{background:var(--ok-bg);border:2px solid var(--ok);border-radius:4px;padding:10px 12px;color:var(--ok)}
.salvo small{display:block;color:var(--ink);font-size:13px}
.rel{font-family:Arial,sans-serif;font-size:13px;color:var(--ink);background:#fff;padding:14px;border:1px solid var(--line);border-radius:3px}
.rel .h{font-size:20px;font-weight:700;color:var(--navy)}
.rel .m{color:var(--muted);margin:2px 0 8px}
.rel .st{padding:8px 10px;border-radius:3px;font-weight:700}
.rel .sec{margin-top:12px}
.rel .sec>div:first-child{color:#fff;font-weight:700;padding:6px 10px;border-radius:3px 3px 0 0}
.rel .sec>div:last-child{border:1px solid var(--line);border-top:0;padding:8px 10px;border-radius:0 0 3px 3px}
.rel .eq{margin-top:8px;padding:2px 0 2px 10px;border-left:5px solid}
.rel .pes{display:flex;flex-wrap:wrap;gap:6px}.rel .pes div{flex:1 1 140px;border:1px solid var(--line);border-radius:3px;padding:4px 8px;font-size:12px}
.rel .gerado{color:var(--muted);font-size:11px;margin-top:10px}
/* adm */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.tile .k{font-size:12px;font-weight:700;color:var(--muted)}.tile .v{font-size:26px;font-weight:700}
table.top{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.top th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;font-weight:400}
table.top td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
table.top td:last-child,table.top th:last-child{text-align:right;color:var(--bad);font-weight:700;white-space:nowrap}
table.top th:last-child{color:#fff;font-weight:400}
.pass{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pass div{flex:1;min-width:0}.pass b{display:block;font-size:16px}.pass small{font-size:14px}
.tg{display:flex;align-items:center;gap:10px;padding:8px 4px}
.tg span{flex:1;font-weight:700}
.sw{width:52px;height:28px;border-radius:14px;background:#C8C8C8;border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--orange)}.sw.on::after{left:28px}
.tg em{font-style:normal;font-size:14px;width:62px}
/* editor */
.ed-tabs{display:flex;flex-wrap:wrap;gap:6px}
.ed-tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.ed-tabs button::first-letter{text-transform:uppercase}
.ed-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ed-q{background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-q.tx{border-left-color:var(--bad);margin-left:22px}
.ed-q .topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-q .topo b{font-size:14px;color:var(--muted);min-width:28px}
.ed-q .topo select{width:auto;flex:1 1 180px;font-size:14px;padding:6px 8px}
.ed-q textarea{min-height:60px;font-size:15px}
.ic{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:16px;flex:none}
.ic:hover{background:#EEF1F6}
.ed-eq{display:grid;grid-template-columns:1fr 170px 44px auto auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:3px;padding:8px}
.ed-eq input[type=color]{width:44px;height:40px;border:1px solid var(--line);padding:2px;background:#fff}
.ed-eq select,.ed-eq input[type=text]{font-size:15px;padding:8px}
@media (max-width:600px){.ed-eq{grid-template-columns:1fr 1fr}}
body.v-cel .ed-eq{grid-template-columns:1fr 1fr}
.nota{background:#EEF4FB;border:1px solid #C9DDF0;border-radius:3px;padding:10px 12px;font-size:14px;color:#21405F}
.rod{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.rod span{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px}.rod i{color:var(--orange);font-style:normal}
/* aviso (Notify) */
.toast{position:fixed;left:50%;top:52px;transform:translateX(-50%);z-index:50;max-width:min(560px,calc(100% - 32px));padding:12px 16px;border-radius:4px;color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.success{background:var(--ok)}.toast.warn{background:#9A6700}.toast.error{background:var(--bad)}.toast.info{background:var(--blue)}
/* fotos no app */
.btn.foto{border-style:dashed;min-height:44px;font-size:15px}
.mini-fotos{display:flex;flex-wrap:wrap;gap:8px}
.mini-fotos span{position:relative;width:72px}
.mini-fotos img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.mini-fotos button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;line-height:24px;padding:0}
.mini-fotos i{display:block;font-style:normal;font-size:11px;color:var(--blue-d);font-weight:700;text-align:center}
.fotos-q{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fq{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fq img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}
.fq-n{font-size:12px;font-weight:700;color:var(--blue-d)}
.fq input{font-size:14px;padding:7px 8px}
.fq .btn{width:100%}
/* páginas do PDF (prévia na tela e arquivo) */
.pv-titulo{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 2px -4px}
.pv-pags{display:flex;flex-direction:column;align-items:center;gap:12px}
.pv-pg{overflow:hidden;box-shadow:0 2px 10px rgba(20,26,58,.18);background:#fff;flex:none}
.previa{position:fixed;inset:0;z-index:60;background:#4A5060;overflow:auto;padding:0 16px 30px}
.pv-bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:#1B1F2E;color:#fff;margin:0 -16px 16px;padding:10px 16px}
.pv-bar span{display:flex;gap:8px}
.pdfdoc{width:794px}
.pdfdoc .pdfpg{width:794px;height:1123px;box-sizing:border-box;padding:42px 45px 0;position:relative;overflow:hidden;background:#fff;color:#151A22;
  font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.35}
.pdfdoc .pdfpg *{box-sizing:border-box}
.pdfdoc .pdfrod{position:absolute;left:45px;right:45px;bottom:18px;display:flex;justify-content:space-between;font-size:10px;color:#68707C;border-top:1px solid #E1E4E8;padding-top:6px}
.pdfdoc h1{font-size:27px;font-weight:800;color:#233176;margin:0 0 3px;line-height:1.15}
.pdfdoc .h1b{margin-top:22px;margin-bottom:10px}
.pdfdoc .sub1{margin:0 0 12px;color:#68707C;font-size:12.5px}
.pdfdoc h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 7px;display:flex;align-items:center;gap:7px;font-weight:700}
.pdfdoc h2::before{content:"";width:11px;height:11px;border-radius:3px;background:currentColor;flex:none}
.pdfdoc .h-ruim{color:#B00020}.pdfdoc .h-pend{color:#B4472B}.pdfdoc .h-alerta{color:#8A5A00}.pdfdoc .h-neutro{color:#233176}.pdfdoc .h-ok{color:#2E7D32}
.pdfdoc .topo{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#141C4A,#233176 55%,#0069B5);border-radius:10px;padding:14px 18px;color:#fff}
.pdfdoc .topo img{height:34px;display:block}
.pdfdoc .topo div{text-align:right}.pdfdoc .topo b{display:block;font-size:15px}.pdfdoc .topo span{font-size:12px;color:#DCE3F2}
.pdfdoc .hero{display:flex;align-items:center;gap:22px;margin:16px 0 12px;padding:16px;border:2px solid #233176;border-radius:10px;background:#F4F6FB}
.pdfdoc .turnos{display:flex;align-items:center;gap:10px;flex:none}
.pdfdoc .t{width:82px;height:90px;border-radius:10px;background:#fff;border:2px solid #233176;color:#233176;font-size:46px;font-weight:800;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pdfdoc .t small{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;color:#68707C}
.pdfdoc .t.entra{background:#233176;color:#fff}.pdfdoc .t.entra small{color:#DCE3F2}
.pdfdoc .seta{font-size:30px;color:#FAA61A;font-weight:800}
.pdfdoc .quem .k{font-size:22px;font-weight:800;line-height:1.15;color:#233176}
.pdfdoc .quem .v{margin-top:6px}.pdfdoc .quem .v2{font-size:12px;color:#68707C;margin-top:6px}
.pdfdoc .placar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pdfdoc .pl{border-radius:9px;padding:11px;border:1.5px solid}
.pdfdoc .pl b{display:block;font-size:27px;font-weight:800;line-height:1}.pdfdoc .pl b small{font-size:15px;font-weight:600}
.pdfdoc .pl span{display:block;font-size:11.5px;font-weight:600;margin-top:4px}
.pdfdoc .pl.ruim{background:#FDECEE;border-color:#F4B4BC;color:#B00020}.pdfdoc .pl.ok{background:#E8F4E9;border-color:#A9D3AC;color:#2E7D32}
.pdfdoc .pl.alerta{background:#FFF3D6;border-color:#F0D28A;color:#8A5A00}.pdfdoc .pl.neutro{background:#EEF1F8;border-color:#C9D0E6;color:#233176}
.pdfdoc .lista-atencao{display:flex;flex-direction:column;gap:7px}
.pdfdoc .item{border:1px solid #F4B4BC;border-left:7px solid #B00020;border-radius:7px;padding:9px 13px;background:#fff}
.pdfdoc .itop{display:flex;align-items:center;gap:8px}
.pdfdoc .pchip{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
.pdfdoc .resp-ruim{color:#B00020;font-weight:800;font-size:11.5px;text-transform:uppercase}
.pdfdoc .fref{margin-left:auto;font-size:11px;font-weight:700;color:#0069B5;border:1px solid #0069B5;border-radius:4px;padding:1px 6px}
.pdfdoc .perg{font-weight:700;margin-top:6px}
.pdfdoc .pobs{margin-top:3px;color:#3B4250}
.pdfdoc .det{margin-top:3px;font-size:13px}.pdfdoc .det b{color:#B00020}
.pdfdoc .tudook{background:#E8F4E9;border:1px solid #A9D3AC;color:#2E7D32;font-weight:700;border-radius:7px;padding:10px 13px}
.pdfdoc .duas{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}
.pdfdoc .pend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.pdfdoc .pend li{display:flex;gap:9px;align-items:flex-start;font-weight:600}
.pdfdoc .box{flex:none;width:15px;height:15px;border:1.5px solid #B4472B;border-radius:3px;margin-top:2px}
.pdfdoc .naofeito{background:#FFF3D6;border:1px solid #F0D28A;border-radius:7px;padding:9px 11px}
.pdfdoc .naofeito p{margin:6px 0 0;color:#8A5A00;font-size:13px}
.pdfdoc .med{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #E1E4E8;padding:6px 0;font-size:13px}.pdfdoc .med b{white-space:nowrap}
.pdfdoc .obsl{margin:0;padding-left:20px}.pdfdoc .obsl li{margin-bottom:4px}
.pdfdoc .vazio{color:#68707C}
.pdfdoc .tabwrap{border:1px solid #E1E4E8;border-radius:8px;overflow:hidden}
.pdfdoc .mat{width:100%;border-collapse:collapse;font-size:12px}
.pdfdoc .mat th{color:#fff;font-size:10.5px;padding:7px 3px;text-align:center;width:74px;line-height:1.15}
.pdfdoc .mat th.it{background:#233176;text-align:left;width:auto;padding-left:10px;font-size:12px}
.pdfdoc .mat td{border-top:1px solid #EEF0F3;padding:5px 3px;text-align:center;font-weight:800;font-size:13px}
.pdfdoc .mat td.it{text-align:left;font-weight:400;font-size:12px;padding-left:10px}
.pdfdoc .mat tr:nth-child(even) td{background:#FAFBFC}
.pdfdoc .mat td.v{color:#2E7D32}.pdfdoc .mat td.x{background:#FDECEE!important;color:#B00020}.pdfdoc .mat td.na{color:#B8BDC6;font-weight:400}
.pdfdoc .mat td.nfc{color:#8A5A00;background:#FFF3D6!important;font-size:9.5px;font-weight:600}.pdfdoc .mat td.num{font-size:11px;color:#233176;white-space:nowrap}
.pdfdoc .duas2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;align-items:start}
.pdfdoc .card{border:1px solid #E1E4E8;border-radius:8px;overflow:hidden}
.pdfdoc .ch{color:#fff;font-weight:700;font-size:13px;padding:7px 11px;display:flex;justify-content:space-between}
.pdfdoc .card table{width:100%;border-collapse:collapse;font-size:11.5px}
.pdfdoc .card td{padding:5px 8px;border-top:1px solid #EEF0F3;vertical-align:top}
.pdfdoc .card td:first-child{width:20px;color:#68707C;text-align:right}
.pdfdoc .card td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.pdfdoc .card td.v{color:#2E7D32}.pdfdoc .card td.x{color:#B00020}.pdfdoc .card td.num{color:#233176}.pdfdoc .card td.na{color:#B8BDC6}
.pdfdoc .card tr.r td{background:#FDECEE}.pdfdoc .card tr.sub td{background:#FDECEE;font-size:11px;padding-top:0;border-top:0;text-align:left;font-weight:400}

function pendente(p, r){
  const a=r[p.q]||{}, v=String(a.resp||'').trim();
  if(p.kind==='op') return !a.resp || (a.resp===p.op2 && !String(a.obs||'').trim());
  if(p.kind==='num') return !v;
  return (r[p.depq]||{}).resp===p.depv && !v;
}
function aplicaTrava(){
  if(S.tela!=='eq') return;
  const c=S.cur, e=c.etapas[c.idx], P=cfg.perg[e.tipo]||[], r=c.resp[e.cod];
  let bloq=false;
  P.forEach(p=>{ const el=document.querySelector(`.perg[data-q="${p.q}"]`); if(el){ el.classList.toggle('trava',bloq); el.querySelectorAll('button,textarea,input').forEach(x=>x.disabled=bloq); }
    if(pendente(p,r)) bloq=true; });
}
function telaEq(){
  const c=S.cur, e=c.etapas[c.idx], P=cfg.perg[e.tipo]||[], r=c.resp[e.cod];
  const n=c.etapas.length, prox=c.etapas[c.idx+1];
  let num=0;
  const itens = P.map(p=>{
    const a=r[p.q]||{}, falta=c.faltaVer&&pendente(p,r);
    if(p.kind==='tx'){
      const dep=r[p.depq]||{}; if(dep.resp!==p.depv) return '';
      return `<div class="perg cond ${falta?'falta':''}" data-q="${p.q}"><div class="t">${esc(p.texto)} *</div>
        <textarea oninput="A.tx('${p.q}',this.value)" placeholder="Obrigatório">${esc(a.resp||'')}</textarea></div>`;
    }
    num++;
    if(p.kind==='num') return `<div class="perg ${falta?'falta':''}" data-q="${p.q}"><div class="t">${num}. ${esc(p.texto)} (${esc(p.un||'')}) *</div>
        <input type="text" inputmode="decimal" placeholder="${esc(p.un||'')}" value="${esc(a.resp||'')}" oninput="A.tx('${p.q}',this.value)"></div>`;
    const sm = (p.op1.length+p.op2.length)>12 ? ' sm':'';
    return `<div class="perg ${falta?'falta':''}" data-q="${p.q}"><div class="t">${num}. ${esc(p.texto)}</div>
      <div class="par"><button class="opt${sm} ${a.resp===p.op1?'okon':''}" onclick="A.resp('${p.q}',1)">${esc(p.op1)}</button>
      <button class="opt${sm} ${a.resp===p.op2?'badon':''}" onclick="A.resp('${p.q}',2)">${esc(p.op2)}</button></div>
      ${a.resp===p.op2?`<div class="req">Explique o que aconteceu e o que foi feito *</div><textarea class="obs" oninput="A.obs('${p.q}',this.value)" placeholder="Obrigatório: o que aconteceu? O que foi feito?">${esc(a.obs||'')}</textarea>${botaoFoto(e.cod, p.q, curto(p.texto), 'Adicionar foto (opcional)')}${miniFotos(e.cod, p.q)}`:''}</div>`;
  }).join('');
  return cab('Checklist · '+esc(cfg.tipoNome[e.tipo]||e.tipo)) +
   `<div class="banner" style="background:${e.cor}"><div class="e">Etapa ${c.idx+1} de ${n} · ${esc(cfg.tipoNome[e.tipo]||'')}</div><div class="n">${esc(e.nome)}</div>

   <div class="dica">Responda na ordem: cada pergunta libera a próxima. Resposta com problema precisa de explicação.</div>` + itens +
   `<button class="btn pri" onclick="A.prox()">Próximo: ${esc(prox?prox.nome:'Quadro do turno')}</button>
    <button class="btn" onclick="A.volta()">Voltar</button>` + rod;
}

function telaRel(){

  const pdfBtns = S.pdfFile
    ? `<div class="salvo"><b>PDF pronto ✓</b><small>${esc(S.pdfFile.name)} · ${Math.max(1, Math.round(S.pdfFile.size/1024))} KB</small></div>

    : `<button class="btn pri" onclick="A.gerarPdf()" ${S.gerando?'disabled':''}>${S.gerando?'Gerando o PDF…':'📄 Gerar PDF'+(fotosDoRel().length?' com '+fotosDoRel().length+(fotosDoRel().length>1?' fotos':' foto'):'')}</button>`;
  const acoes = pdfBtns + `<div class="linha"><button class="btn" onclick="A.zap()">Enviar resumo em texto</button><button class="btn" onclick="A.copiar()">Copiar texto</button></div>` +
    (ver ? `<div class="dica">As fotos não ficam guardadas: o PDF do histórico sai sem fotos.</div>` : '');

  else if(!ver) topo = `<div class="salvo"><b>Passagem salva ✓</b><small>Gere o PDF e mande no grupo do WhatsApp.</small></div>` + acoes;
  else topo = acoes;
  const voltar = ver ? `<button class="btn" onclick="S.tela=S.volta;S.pdfFile=null;R(true)">Voltar</button>`
     : S.salvo ? `<button class="btn" onclick="A.inicio()">Voltar ao início</button>`
     : `<button class="btn" onclick="S.tela=(S.rec.status==='nao_feita'?'inicio':'quadro');R(true)">Voltar e corrigir</button>`;
  return cab('Relatório da passagem de turno') + topo + `<div class="pv-titulo">Páginas do PDF</div><div id="rel" class="pv-pags inline">${pags}</div>` + voltar + rod;
}

function montaRec(){
  const c=S.cur, itens=[];
  c.etapas.forEach(e=>{ (cfg.perg[e.tipo]||[]).forEach(p=>{ const a=c.resp[e.cod][p.q]; if(!a||!String(a.resp||'').trim()) return;
     if(p.kind==='tx'){ const dep=c.resp[e.cod][p.depq]; if(!dep||dep.resp!==p.depv) return; }
     itens.push({eq:e.cod,nome:e.nome,q:p.q,kind:p.kind,texto:p.texto,curto:curto(p.texto),resp:String(a.resp).trim(),un:p.un||'',obs:a.obs||'',ruim:p.kind==='op'&&a.resp===p.op2}); }); });
  return { id:Date.now().toString(36), data_hora:c.quando, operador:c.op, de:c.de, para:c.para, status:'feita', motivo:'',
    eqs:c.etapas.map(e=>({cod:e.cod,nome:e.nome,cor:e.cor})), naoFeitos:c.naoFeitos||[], itens, problemas:itens.filter(i=>i.ruim).length,
    prox:[...c.prox, ...linhas(c.proxOutros)], feito:[...c.feito, ...linhas(c.feitoOutros)],
    caixas:cfg.caixas.filter(x=>c.cx[x]>0).map(x=>({nome:x,n:c.cx[x]})), obs:linhas(c.obsTurno) };
}
function relHTML(r){

      ${tx.map(i=>`<div>• ${esc(i.texto)} <b>${esc(i.resp)}${i.un?' '+esc(i.un):''}</b></div>`).join('')}</div>`; }).join('') +
    ((r.naoFeitos||[]).length?`<div style="margin-top:10px;padding:6px 10px;background:var(--warn-bg);color:var(--warn);border-radius:3px"><b>Não feitos neste turno:</b> ${esc(r.naoFeitos.join(', '))}</div>`:'');
  return `<div class="rel">${cab}<div class="st" style="${r.problemas?'background:var(--bad-bg);color:var(--bad)':'background:var(--ok-bg);color:var(--ok)'}">${r.problemas?r.problemas+' ponto(s) fora do normal':'✓ Checklist sem problemas'}</div>` +
    sec('Checklist dos equipamentos', eqs) + sec('Para o próximo turno', lista(r.prox), 'var(--prox)') + sec('Feito neste turno', lista(r.feito), 'var(--ok)') +
    sec('Caixas', r.caixas.length?r.caixas.map(c=>`<div>• ${esc(c.nome)}: <b>${c.n}</b></div>`).join(''):vazio, '#3B4250') +
    sec('Observações', lista(r.obs), 'var(--warn)') + `<div class="gerado">Gerado pelo app Passagem de Turno · Desenvolvido por Hamilton Lira</div></div>`;
}
function zapTxt(r){   // mesmo texto que o app do Power Apps monta

  return s+NL+['', '*Checklist:* '+(probs?NL+probs:'tudo OK ✓')+(med?NL+med:'')+((r.naoFeitos||[]).length?NL+'*Não feitos neste turno:* '+r.naoFeitos.join(', '):''),

}

function reduzFoto(file){
  return new Promise((ok, erro) => {
    const rd = new FileReader();
    rd.onerror = erro;
    rd.onload = () => { const im = new Image(); im.onerror = erro; im.onload = () => {
      const m = 1400, k = Math.min(1, m / Math.max(im.width, im.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/jpeg', 0.8)); }; im.src = rd.result; };
    rd.readAsDataURL(file);
  });
}

/* ---------------------------------------------------------------- PDF: páginas A4 (794 x 1123 px) desenhadas em HTML e "fotografadas" */
const PG_W = 794, PG_H = 1123;
function pdfPaginas(r, fotos){
  const e2 = esc, LOGO_IMG = `<img src="${LOGO}" alt="Moura">`;
  const quando = new Date(r.data_hora), data = fmt(quando).slice(0,10), hora = fmt(quando).slice(11);
  const chip = (cor, nome) => `<span class="pchip" style="background:${cor}">${e2(nome)}</span>`;
  const corEq = cod => (cfg.equip.find(x=>x.cod===cod)||{}).cor || '#233176';
  const tipoEq = cod => (cfg.equip.find(x=>x.cod===cod)||{}).tipo;
  const pagina = (n, tot, corpo) => `<section class="pdfpg">${corpo}<div class="pdfrod"><span>Passagem de turno ${r.de} → ${r.para} · ${data} ${hora} · ${e2(r.operador)}</span><span>página ${n} de ${tot}</span></div></section>`;
  const topo = `<header class="topo">${LOGO_IMG}<div><b>Relatório de passagem de turno</b><span>Filtros e CAC · UND14</span></div></header>`;
  const hero = `<div class="hero"><div class="turnos"><div class="t"><small>sai</small>${r.de}</div><div class="seta">→</div><div class="t entra"><small>entra</small>${r.para}</div></div>
    <div class="quem"><div class="k">Passagem do turno ${r.de} para o turno ${r.para}</div><div class="v">Passada por <b>${e2(r.operador)}</b> em <b>${data} às ${hora}</b></div>
    <div class="v2">${r.status==='nao_feita' ? 'A passagem não foi feita neste turno.' : 'Leia antes de assumir o turno. Detalhes a partir da página 2.'}</div></div></div>`;
  if(r.status==='nao_feita'){
    return [pagina(1, 1, topo + hero + `<h2 class="h-alerta">Passagem não realizada</h2><div class="naofeito"><b>Motivo:</b> ${e2(r.motivo)}</div>`)];
  }
  const fotosDe = (eq, q) => (fotos||[]).map((f,i)=>({f, n:i+1})).filter(x=>x.f.eq===eq && x.f.q===q).map(x=>'Foto '+x.n).join(', ');
  const probs = r.itens.filter(i=>i.ruim);
  const eqOk = r.eqs.filter(e=>!probs.some(p=>p.eq===e.cod)).length;
  const pend = r.prox;
  const atencao = probs.length ? probs.map(p=>{
      const cd = r.itens.find(i=>i.eq===p.eq && i.kind==='tx' && (cfg.perg[tipoEq(p.eq)]||[]).some(x=>x.q===i.q && x.depq===p.q));
      const ft = fotosDe(p.eq, p.q);
      return `<div class="item"><div class="itop">${chip(corEq(p.eq), p.nome)}<span class="resp-ruim">${e2(p.resp)}</span>${ft?`<span class="fref">${ft}</span>`:''}</div>
        <div class="perg">${e2(p.curto||curto(p.texto))}</div>${String(p.obs||'').trim()?`<div class="pobs">“${e2(p.obs.trim())}”</div>`:''}
        ${cd?`<div class="det"><b>${e2(cd.curto||curto(cd.texto))}:</b> ${e2(cd.resp)}</div>`:''}</div>`; }).join('')
    : `<div class="tudook">✓ Nenhum problema no checklist</div>`;
  const med = r.itens.filter(i=>i.kind==='num').map(i=>`<div class="med"><span>${e2(i.nome)} · ${e2(i.curto||curto(i.texto))}</span><b>${e2(i.resp)} ${e2(i.un||'')}</b></div>`).join('');
  const nf = (r.naoFeitos||[]).length ? `<div class="naofeito">${r.naoFeitos.map(n=>chip((cfg.equip.find(x=>x.nome===n)||{}).cor||'#3B4250', n)).join(' ')}<p>Não deu para fazer neste turno. Fica para o turno ${r.para}.</p></div>` : `<div class="vazio">—</div>`;
  const p1 = topo + hero +
    `<div class="placar"><div class="pl ruim"><b>${probs.length}</b><span>pontos de atenção</span></div>
      <div class="pl ok"><b>${eqOk}<small>/${r.eqs.length}</small></b><span>equipamentos sem problema</span></div>
      <div class="pl alerta"><b>${(r.naoFeitos||[]).length}</b><span>não feito no turno</span></div>
      <div class="pl neutro"><b>${pend.length}</b><span>pendências para o turno ${r.para}</span></div></div>
    <h2 class="h-ruim">Atenção para o turno ${r.para}</h2><div class="lista-atencao">${atencao}</div>
    <div class="duas"><div><h2 class="h-pend">Pendências para o turno ${r.para}</h2>${pend.length?`<ul class="pend">${pend.map(p=>`<li><span class="box"></span>${e2(p)}</li>`).join('')}</ul>`:'<div class="vazio">—</div>'}</div>
      <div><h2 class="h-alerta">Não feito neste turno</h2>${nf}${med?`<h2 class="h-neutro">Medições</h2>${med}`:''}</div></div>
    <h2 class="h-neutro">Observações do turno</h2>${r.obs.length?`<ul class="obsl">${r.obs.map(o=>`<li>${e2(o)}</li>`).join('')}</ul>`:'<div class="vazio">—</div>'}`;

  // página 2: quadro item x filtro + transporte pneumático e CAC
  const feitoEq = cod => r.eqs.some(e=>e.cod===cod);
  const nfEq = cod => (r.naoFeitos||[]).includes((cfg.equip.find(x=>x.cod===cod)||{}).nome);
  const resp = (cod, q) => r.itens.find(i=>i.eq===cod && i.q===q);
  const filtros = cfg.equip.filter(e=>['refino','filtro','pneg'].includes(e.tipo));
  const outros = cfg.equip.filter(e=>!['refino','filtro','pneg'].includes(e.tipo));
  const linhasM = [];
  filtros.forEach(e=>(cfg.perg[e.tipo]||[]).forEach(x=>{ if(x.kind==='tx') return;
    const k = /martelos|moto vibradores/i.test(x.texto) ? 'Martelos / moto vibradores fixos, sem trinca' : curto(x.texto);
    let L = linhasM.find(l=>l.k===k); if(!L){ L = {k, por:{}}; linhasM.push(L); } L.por[e.cod] = x; }));
  const cel = (e, x) => {
    if(!feitoEq(e.cod)) return nfEq(e.cod) ? '<td class="nfc">não feito</td>' : '<td class="na">fora</td>';
    if(!x) return '<td class="na">—</td>';
    const a = resp(e.cod, x.q); if(!a) return '<td class="na">—</td>';
    if(x.kind==='num') return `<td class="num">${e2(a.resp)} ${e2(x.un||'')}</td>`;
    return a.ruim ? '<td class="x">✗</td>' : '<td class="v">✓</td>';
  };
  const nomeCurto = n => n.replace(/^Filtro (do |de )?/i,'').replace(/^(.)/, m=>m.toUpperCase());
  const mat = `<div class="tabwrap"><table class="mat"><tr><th class="it">Filtros de mangas</th>${filtros.map(e=>`<th style="background:${e.cor}">${e2(nomeCurto(e.nome))}</th>`).join('')}</tr>
    ${linhasM.map((l,n)=>`<tr><td class="it">${n+1}. ${e2(l.k)}</td>${filtros.map(e=>cel(e, l.por[e.cod])).join('')}</tr>`).join('')}</table></div>`;
  const card = e => {
    if(!feitoEq(e.cod)) return `<div class="card nf"><div class="ch" style="background:${e.cor}">${e2(e.nome)}<span>${nfEq(e.cod)?'não feito':'fora de uso'}</span></div><div class="vazio2">Checklist não feito neste turno.</div></div>`;
    let n = 0; const np = probs.filter(p=>p.eq===e.cod).length;
    const rows = (cfg.perg[e.tipo]||[]).map(x=>{ const a = resp(e.cod, x.q);
      if(x.kind==='tx') return a ? `<tr class="sub"><td></td><td colspan="2">↳ ${e2(curto(x.texto))}: <b>${e2(a.resp)}</b></td></tr>` : '';
      n++; if(!a) return `<tr><td>${n}</td><td>${e2(curto(x.texto))}</td><td class="na">—</td></tr>`;
      if(x.kind==='num') return `<tr><td>${n}</td><td>${e2(curto(x.texto))}</td><td class="num">${e2(a.resp)} ${e2(x.un||'')}</td></tr>`;
      return `<tr class="${a.ruim?'r':''}"><td>${n}</td><td>${e2(curto(x.texto))}</td><td class="${a.ruim?'x':'v'}">${a.ruim?'✗':'✓'} ${e2(a.resp)}</td></tr>`; }).join('');
    return `<div class="card"><div class="ch" style="background:${e.cor}">${e2(e.nome)}<span>${np?np+(np>1?' problemas':' problema'):'✓ tudo OK'}</span></div><table>${rows}</table></div>`;
  };
  const p2 = `<h1>Checklist completo</h1><p class="sub1">Todas as respostas do turno ${r.de}. ✓ normal · <b style="color:#B00020">✗ fora do normal</b> (explicações na página 1) · — não se aplica.</p>${mat}
    <div class="duas2">${outros.map(card).join('')}</div>`;

  // página 3 em diante: quadro do turno e, no final, as fotos
  const quadro = `<h1>Quadro do turno</h1><div class="duas q"><div><h2 class="h-ok">Feito neste turno</h2>${r.feito.length?`<ul class="feito">${r.feito.map(x=>`<li>${e2(x)}</li>`).join('')}</ul>`:'<div class="vazio">—</div>'}</div>
    <div><h2 class="h-neutro">Caixas</h2>${r.caixas.length?`<table class="pcx">${r.caixas.map(c=>`<tr><td>${e2(c.nome)}</td><td>${c.n}</td></tr>`).join('')}</table>`:'<div class="vazio">—</div>'}</div></div>`;
  const fig = (f, i) => {
    const onde = f.eq==='geral' ? chip('#3B4250','Geral') : chip(corEq(f.eq), (cfg.equip.find(x=>x.cod===f.eq)||{}).nome || f.eq);
    return `<figure><div class="fimg"><img src="${f.src}" alt=""><span class="fn">Foto ${i+1}</span></div><figcaption>${onde}<b>${e2(f.leg||'')}</b><small>${e2(r.operador)} · ${data} ${hora}</small></figcaption></figure>`;
  };
  const fs = fotos || [];
  const blocos = [];
  const naPag3 = fs.slice(0, 4), resto = fs.slice(4);
  blocos.push(quadro + (fs.length ? `<h1 class="h1b">Fotos</h1><div class="fotos">${naPag3.map((f,i)=>fig(f,i)).join('')}</div>` : '') +
              (resto.length ? '' : `<div class="fim">Relatório gerado pelo app Passagem de Turno · Filtros e CAC · UND14 · Desenvolvido por Hamilton Lira</div>`));
  for(let i=0; i<resto.length; i+=6){
    const fatia = resto.slice(i, i+6), ultima = i+6 >= resto.length;
    blocos.push(`<h1>Fotos (continuação)</h1><div class="fotos">${fatia.map((f,j)=>fig(f, 4+i+j)).join('')}</div>` +
                (ultima ? `<div class="fim">Relatório gerado pelo app Passagem de Turno · Filtros e CAC · UND14 · Desenvolvido por Hamilton Lira</div>` : ''));
  }
  const corpos = [p1, p2, ...blocos], tot = corpos.length;
  return corpos.map((c, i)=>pagina(i+1, tot, c));
}
function nomePdf(r){ const d = new Date(r.data_hora); return `Passagem_${r.de}_para_${r.para}_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.pdf`; }

async function gerarPdfArquivo(){

  const caixa = document.createElement('div');
  caixa.className = 'pdfdoc'; caixa.style.cssText = `position:fixed;left:-20000px;top:0;width:${PG_W}px`;
  caixa.innerHTML = pags.join(''); document.body.appendChild(caixa);
  try {
    await Promise.all([...caixa.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(ok => { im.onload = im.onerror = ok; })));
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'p', unit:'mm', format:'a4', compress:true });
    const secoes = [...caixa.querySelectorAll('.pdfpg')];
    for(let i=0; i<secoes.length; i++){
      const cv = await html2canvas(secoes[i], { scale:2, backgroundColor:'#ffffff', useCORS:true, width:PG_W, height:PG_H, windowWidth:PG_W });
      if(i) doc.addPage();
      doc.addImage(cv.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
    }
    return new File([doc.output('blob')], nomePdf(S.rec), { type:'application/pdf' });
  } finally { caixa.remove(); }
}

function imprimirPaginas(){   // sem internet: mesma página, pelo "Salvar como PDF" do navegador
  const pags = pdfPaginas(S.rec, fotosDoRel());
  const area = $('impressao'); area.innerHTML = `<div class="pdfdoc">${pags.join('')}</div>`;
  document.body.classList.add('imprimindo');
  setTimeout(()=>{ window.print(); setTimeout(()=>{ document.body.classList.remove('imprimindo'); area.innerHTML=''; }, 500); }, 300);
}


/* ---------------------------------------------------------------- ações */

const A = {

    S.cur=novaPassagem(); S.fotos=[]; S.pdfFile=null; S.salvo=false; S.modo='novo'; S.tela='eq'; R(true); },
  naoFez(){ if(!S.ini.op||!S.ini.de||!S.ini.para){ avisa('Escolha seu nome e os turnos antes de registrar.','warn'); return; } const m=($('motivo').value||'').trim(); if(!m){ avisa('Escreva o motivo.','warn'); return; }

    db.unshift(r); A.grava(); S.rec=r; S.salvo=true; S.modo='novo'; S.naoFez=false; S.tela='rel'; R(true); avisa('Registrado.','success'); },
  resp(q,k){ const c=S.cur,e=c.etapas[c.idx],p=cfg.perg[e.tipo].find(x=>x.q===q),a=c.resp[e.cod][q]||(c.resp[e.cod][q]={}); const v=k===1?p.op1:p.op2; a.resp = v; R(); },
  obs(q,v){ const c=S.cur; c.resp[c.etapas[c.idx].cod][q].obs=v; aplicaTrava(); },

    S.cur.faltaVer=false; S.cur.idx++; S.tela = S.cur.idx>=S.cur.etapas.length?'quadro':'eq'; R(true); },

      S.ini={op:ops[k%ops.length],de:ts[ti],para:ts[(ti+1)%ts.length],fora:k%4===2?['prim02']:[]}; const c=novaPassagem(); c.quando=d.toISOString();
      if(k===5){ db.push({id:'ex'+k,data_hora:c.quando,operador:c.op,de:c.de,para:c.para,status:'nao_feita',motivo:mot[0],eqs:[],itens:[],problemas:0,prox:[],feito:[],caixas:[],pesos:[],obs:[]}); continue; }
      c.etapas.forEach((e,j)=>cfg.perg[e.tipo].forEach((p,n)=>{ if(p.kind==='op'){ const ruimV=(k%3===0&&j===k%5&&p.texto.includes('moegas'))||(k%4===1&&j===c.etapas.length-1&&n===0); c.resp[e.cod][p.q]={resp:ruimV?p.op2:p.op1,obs:ruimV?'Avisado ao líder do turno':''}; } else if(p.kind==='num') c.resp[e.cod][p.q]={resp:(6+(k%5)/10).toFixed(1).replace('.',',')}; }));

  const y=window.scrollY, app=$('app');

}
